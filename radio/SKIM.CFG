# SKIM.CFG - settings for SKIM, multi-signal CW decoder (copy next to SKIM.APP in \IC-705\Apps\)
# SKIM by Pablo Torres, EA5JLJ - MIT licence
# Lines starting with # are comments. Every setting is optional.

# mode: multi = several stations, one line per station (default) | single = only the strongest station
mode=multi
# det: thr = threshold (best on real audio) | vit = Viterbi | auto = both, chosen word by word
det=thr
# Tone search range in Hz. It should cover the radio's filter (in CW it is centred on the CW PITCH).
tmin=250
tmax=2500
# tone: >0 locks the decoder to that audio tone and disables the search (e.g. tone=600)
tone=0
# Initial speed (WPM)
wpm=20
# chans: stations decoded at once in multi mode, 1-12 (1-4 with det=vit or det=auto).
#        More helps in a pile-up; fewer gives a calmer screen. The log reports the CPU load.
chans=8

# pitch: your radio's CW PITCH in Hz (press the MULTI knob in CW mode to see it; factory default 600).
#        With it each line shows the station's real frequency
#        ("7025.0 EA4XYZ: ..."); 0 = show the audio tone instead.
pitch=600
# cwr=1 if you use CW-R, or if "CW Normal Side" is set to USB (the offset is reversed).
#       The radio does not tell apps whether it is in CW or CW-R, so this is manual.
cwr=0

# calls=1: show each station's detected callsign, "CQ" when it is calling CQ,
#          and "CALL>OTHER" when it is in a QSO.
calls=1
# clean=1: remove typical noise from DECODE (stray E/T, *). The log also keeps the raw text.
clean=1
# words=1: fix word spacing with a small CW vocabulary and the callsign rules
#          ("CQCQDEEA4XYZ" -> "CQ CQ DE EA4XYZ", "EA4 XYZ" -> "EA4XYZ"). Only spaces change, never letters.
words=1
# pause: ms of silence that close a DECODE line (lower = faster, shorter lines)
pause=1500
# dcols: width of DECODE and log lines
dcols=40
# decode=1: send lines to the native DECODE screen; log=1: write SKIMnn.LOG (one per session)
# logs: how many session logs to keep (1-98); older ones are deleted at start
decode=1
log=1
logs=10

# The settings below only affect the app's own window (MENU > SET > Apps > SKIM).
# cols: panel line width
cols=30
# spec: text spectrum line: 0 off | 2 digits 0-9 | 3 ASCII .:-=+*# (the tracked tone is marked |).
#       1 = block characters, but the IC-705 font lacks them (they show as "?").
spec=2
# fonttest=1: show a character test line for the first 10 s
fonttest=0
